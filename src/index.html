<body>

    <!-- fv -->
    <section class="l-fv p-fv">
        <div class="l-fv__inner">
            <div class="p-fv__titleWrap">
                <figure>
                    <img src="./assets/img/fv_pot.png" alt="">
                </figure>
                <h2 class="p-fv__title">健康<span>と</span>美しさ<span>は</span><br>
                    自宅<span>で</span>作る時代</h2>
            </div>
            <picture class="p-fv__img">
                <source media="(max-width: 768px)" srcset="./assets/img/fv_img-sp.png">
                <img src="./assets/img/fv_img.png" alt="" decoding="async">
            </picture>
            <p class="p-fv__text">ナノバブル水素水で健康習慣</p>
            <div class="p-fv__wrap">
                <div class="p-fv__pointWrap">
                    <div class="p-fv__point">
                        <picture>
                            <source media="(max-width: 767px)" srcset="./assets/img/point-image01-sp.png">
                            <img src="./assets/img/point-image01.png" alt="">
                        </picture>
                    </div>
                    <div class="p-fv__point">
                        <picture>
                            <source media="(max-width: 767px)" srcset="./assets/img/point-image02-sp.png">
                            <img src="./assets/img/point-image02.png" alt="">
                        </picture>
                    </div>
                    <div class="p-fv__point">
                        <picture>
                            <source media="(max-width: 767px)" srcset="./assets/img/point-image03-sp.png">
                            <img src="./assets/img/point-image03.png" alt="">
                        </picture>
                    </div>
                </div>
            </div>
